spring:
  application:
    name: razorpay

  datasource:
    url: ${DB_URL:}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Kolkata

  kafka:
    bootstrap-servers: ${KAFKA_BROKERS:localhost:9092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        retries: 3
        spring.json.add.type.headers: false
    consumer:
        group-id: ${KAFKA_CONSUMER_GROUP_ID:razorpay-monolith}
        auto-offset-reset: earliest
        enable-auto-commit: false
        key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
        value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
        properties:
            spring.json.trusted.packages: "com.pal.dipesh.razorpay.*"
            spring.json.use.type.headers: false
            spring.json.value.default.type: java.util.LinkedHashMap

  data:
    redis:
      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 10
          max-idle: 5
          min-idle: 1

app:
  vault:
    master-key: ${PAYMENT_MASTER_KEY:}

  webhook:
    delivery:
      redis-key: "webhook-retry"
      poll-batch-size: 100

  kafka:
    topics:
      payment: payment.events
      order: order.events
      refund: refund.events
      settlement: settlement.events

  security:
    jwt:
      private-key: ${JWT_PRIVATE_KEY:}
      public-key: ${JWT_PUBLIC_KEY:}
      passphrase: ${JWT_KEY_PASSPHRASE:}
      access-token-expiry-ms: 900000      # 15 minutes — PCI-DSS recommends short-lived
      refresh-token-expiry-ms: 86400000   # 24 hours
      issuer: ${spring.application.name}

    cookie:
      path: /api/v1/auth                  # cookie only sent to auth endpoints (refresh, logout)
      same-site: Strict                   # blocks browser CSRF for cookie-bearing requests
      secure: ${COOKIE_SECURE:true}       # must be true in prod; override to false only for local http dev

payment:
  order:
    default-expiry-minutes: 30

  simulator:
    poll-interval-ms: 5000
    chaos-mode: NORMAL
    method:
      CARD:
        min-delay-seconds: 2
        max-delay-seconds: 6
        success-rate: 90
      UPI:
        min-delay-seconds: 1
        max-delay-seconds: 3
        success-rate: 95
      NET_BANKING:
        min-delay-seconds: 4
        max-delay-seconds: 10
        success-rate: 80